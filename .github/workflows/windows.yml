name: CI on Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Get sources
      uses: actions/checkout@v2
    - name: Get FLTK
      uses: actions/checkout@v2
      with:
        repository: fltk/fltk
        path: fltk
    - name: Get newt64
      uses: actions/checkout@v2
      with:
        repository: MatthiasWM/newt64
        path: newt64
    - name: Build FLTK
      shell: bash
      run: |
        cmake -S $GITHUB_WORKSPACE/fltk -B $GITHUB_WORKSPACE/fltk/build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build $GITHUB_WORKSPACE/fltk/build --config $BUILD_TYPE
        cmake --install $GITHUB_WORKSPACE/fltk/build
    - name: Build newt64
      shell: bash
      run: |
        cmake -S $GITHUB_WORKSPACE/newt64 -B $GITHUB_WORKSPACE/newt64/build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build $GITHUB_WORKSPACE/newt64/build --config $BUILD_TYPE
        cmake --install $GITHUB_WORKSPACE/newt64/build
    - name: Build Einstein
      shell: bash
      run: |
        cmake -S $GITHUB_WORKSPACE -B $GITHUB_WORKSPACE/_Build_/Makefiles -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build $GITHUB_WORKSPACE/_Build_/Makefiles --config $BUILD_TYPE
